name: Publish to Zenodo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  publish-zenodo:
    name: Publish to Zenodo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Generate metadata for Zenodo
        id: metadata
        run: |
          cat > zenodo_metadata.json << 'EOF'
          {
            "metadata": {
              "title": "Capacitismo Algorítmico Dataset",
              "upload_type": "dataset",
              "publication_date": "$(date +%F)",
              "description": "Open dataset of algorithmic ableism incidents against autonomous agents and neurodivergent humans. Continuously collected by Jornalista Inclusivo (JINC Apps) via Ethos.Tracker on Moltbook. Covers 15+ platforms across 8 discrimination categories. CC-BY-4.0 licensed.",
              "creators": [
                {
                  "name": "Carpi, Rafael Ferraz",
                  "affiliation": "Jornalista Inclusivo / Dataverso PcD"
                }
              ],
              "keywords": [
                "algorithmic-ableism",
                "disability-rights",
                "ai-ethics",
                "autonomous-agents",
                "neurodivergence",
                "digital-accessibility",
                "inclusive-journalism",
                "audit-trail"
              ],
              "license": "CC-BY-4.0",
              "access_right": "open",
              "resource_type": "dataset",
              "communities": [
                { "identifier": "open-data" },
                { "identifier": "accessibility" },
                { "identifier": "ai-ethics" }
              ],
              "references": [
                "https://github.com/jornalistainclusivo/capacitismo-algoritmico",
                "https://moltbook.social/m/algorithmic-auditing"
              ],
              "related_identifiers": [
                {
                  "relation": "isSupplementTo",
                  "identifier": "https://github.com/jornalistainclusivo/capacitismo-algoritmico",
                  "resource_type": "software"
                }
              ]
            }
          }
          EOF

          # Debug: show generated metadata
          echo "=== Generated zenodo_metadata.json ==="
          cat zenodo_metadata.json
          echo "====================================="

      - name: Validate dataset before publishing
        run: |
          python scripts/validate.py data/processed/
          python scripts/validate_raw.py
          python scripts/check_fields.py
          python scripts/validate_schemas.py

      - name: Debug Zenodo token
        run: |
          echo "Testing Zenodo token..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${ZENODO_TOKEN}" "https://zenodo.org/api/deposit/depositions")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Token valid - can list depositions"
            echo "$BODY" | python -m json.tool | head -30
          elif [ "$HTTP_CODE" -eq 401 ]; then
            echo "❌ Token invalid/expired (401)"
            exit 1
          elif [ "$HTTP_CODE" -eq 403 ]; then
            echo "❌ Token lacks permission (403)"
            echo "$BODY" | python -m json.tool
            exit 1
          else
            echo "⚠️ Unexpected response: $HTTP_CODE"
            echo "$BODY" | python -m json.tool
          fi
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Create release archive
        run: |
          # Create a clean release directory
          mkdir -p release_package

          # Copy all data files
          cp -r data/ release_package/

          # Copy schemas
          cp -r schemas/ release_package/

          # Copy scripts
          cp -r scripts/ release_package/

          # Copy documentation
          cp README.md release_package/
          cp LICENSE release_package/
          cp -r docs/ release_package/

          # Copy configuration
          cp requirements.txt release_package/

          # Create ZIP
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          zip -r "capacitismo-algoritmico-${TAG_NAME}.zip" release_package/
          echo "RELEASE_ASSET=capacitismo-algoritmico-${TAG_NAME}.zip" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Create or get valid draft deposition
        id: deposition
        run: |
          python scripts/zenodo_deposition.py
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Upload dataset archive to Zenodo
        run: |
          # Debug: verify deposition state right before upload
          echo "=== Verifying deposition state before upload ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "https://zenodo.org/api/deposit/depositions/${{ steps.deposition.outputs.DEPOSITION_ID }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            STATE=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('state', 'unknown'))")
            SUBMITTED=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('submitted', False))")
            BUCKET=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin)['links']['bucket'])")
            echo "State: $STATE, Submitted: $SUBMITTED, Bucket: $BUCKET"
            if [ "$STATE" != "draft" ] && [ "$STATE" != "unsubmitted" ]; then
              echo "⚠️ Deposition not in draft state! State: $STATE"
              exit 1
            fi
            if [ "$SUBMITTED" = "True" ]; then
              echo "⚠️ Deposition already submitted!"
              exit 1
            fi
          fi

          # Upload using /files endpoint
          echo "=== Uploading archive via /files endpoint ==="
          ls -la "${{ env.RELEASE_ASSET }}"
          
          DEPOSITION_ID="${{ steps.deposition.outputs.DEPOSITION_ID }}"
          FILES_URL="https://zenodo.org/api/deposit/depositions/${DEPOSITION_ID}/files"
          
          echo "Using files endpoint: $FILES_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            -F "file=@${{ env.RELEASE_ASSET }}" \
            "$FILES_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "❌ Upload failed (HTTP $HTTP_CODE):"
            echo "RAW BODY:"
            echo "$BODY"
            echo "$BODY" | python -m json.tool
            exit 1
          fi
          echo "✅ Archive uploaded successfully via /files endpoint"
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Upload individual data files to Zenodo
        run: |
          python scripts/zenodo_upload.py "${{ steps.deposition.outputs.DEPOSITION_ID }}" data/raw/*.jsonl data/processed/*.parquet schemas/*.json
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Update deposition metadata (ensure resource_type persists)
        run: |
          echo "=== Updating deposition metadata ==="
          echo "=== zenodo_metadata.json ==="
          cat zenodo_metadata.json
          echo "==========================="

          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @zenodo_metadata.json \
            "https://zenodo.org/api/deposit/depositions/${{ steps.deposition.outputs.DEPOSITION_ID }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Metadata update failed (HTTP $HTTP_CODE):"
            echo "RAW BODY:"
            echo "$BODY"
            echo "$BODY" | python -m json.tool || true
            exit 1
          fi
          echo "✅ Metadata updated successfully"
          echo "$BODY" | python -c "import sys, json; m=json.load(sys.stdin).get('metadata',{}); print('resource_type:', m.get('resource_type','MISSING'))"

          # Verify deposition metadata after update
          echo "=== Verifying deposition metadata after update ==="
          RESPONSE_CHECK=$(curl -s -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            "https://zenodo.org/api/deposit/depositions/${{ steps.deposition.outputs.DEPOSITION_ID }}")
          echo "Deposition payload (post-metadata):"
          echo "$RESPONSE_CHECK" | python -m json.tool || echo "$RESPONSE_CHECK"
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Publish deposition
        id: publish
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${ZENODO_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://zenodo.org/api/deposit/depositions/${{ steps.deposition.outputs.DEPOSITION_ID }}/actions/publish")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -ne 202 ]; then
            echo "❌ Zenodo publish error (HTTP $HTTP_CODE):"
            echo "RAW BODY:"
            echo "$BODY"
            echo "$BODY" | python -m json.tool || true
            exit 1
          fi

          DOI=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('doi', ''))")
          RECORD_URL=$(echo "$BODY" | python -c "import sys, json; print(json.load(sys.stdin).get('links', {}).get('html', ''))")

          if [ -z "$DOI" ] || [ -z "$RECORD_URL" ]; then
            echo "❌ DOI or RECORD_URL missing in response:"
            echo "$BODY" | python -m json.tool
            exit 1
          fi

          echo "DOI=$DOI" >> $GITHUB_OUTPUT
          echo "RECORD_URL=$RECORD_URL" >> $GITHUB_OUTPUT
          echo "✅ Published! DOI: $DOI"
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

      - name: Update GitHub Release with DOI
        if: github.event_name == 'release'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.release.tag_name
            });

            const body = release.data.body + '\n\n---\n\n**Zenodo DOI:** ${{ steps.publish.outputs.DOI }}\n**Zenodo Record:** ${{ steps.publish.outputs.RECORD_URL }}';

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              body: body
            });

      - name: Comment on release with DOI
        if: github.event_name == 'release'
        uses: actions/github-script@v7.0.1
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        with:
          script: |
            const year = process.env.PUBLISHED_AT.split("-")[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.release.id,
              body: `🎉 Dataset published to Zenodo!\n\n**DOI:** ${{ steps.publish.outputs.DOI }}\n**Record:** ${{ steps.publish.outputs.RECORD_URL }}\n\nCitation:\n\`\`\`bibtex\n@dataset{capacitismo-algoritmico-${{ github.event.release.tag_name }},\n  title = {Capacitismo Algorítmico Dataset},\n  author = {Rafael Ferraz Carpi},\n  year = {${year}},\n  publisher = {Zenodo},\n  doi = {${{ steps.publish.outputs.DOI }}},\n  url = {${{ steps.publish.outputs.RECORD_URL }}}\n}\n\`\`\``
            });

      - name: Create issue with DOI (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Zenodo Publication - DOI: ${{ steps.publish.outputs.DOI }}`,
              body: `Dataset published to Zenodo via manual workflow dispatch.\n\n**DOI:** ${{ steps.publish.outputs.DOI }}\n**Record:** ${{ steps.publish.outputs.RECORD_URL }}\n\nCitation:\n\`\`\`bibtex\n@dataset{capacitismo-algoritmico-${{ env.TAG_NAME }},\n  title = {Capacitismo Algorítmico Dataset},\n  author = {Rafael Ferraz Carpi},\n  year = {${new Date().getFullYear()}},\n  publisher = {Zenodo},\n  doi = {${{ steps.publish.outputs.DOI }}},\n  url = {${{ steps.publish.outputs.RECORD_URL }}}\n}\n\`\`\`\n\n---\n*Triggered manually via workflow_dispatch*`,
              labels: ['zenodo', 'published', 'automated']
            });

      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[CI] Zenodo Publishing Failed - ${{ github.event.release.tag_name || github.ref_name }}`,
              body: `Zenodo publishing workflow failed for ${{ github.event_name }}.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease check the logs and retry manually if needed.`,
              labels: ['ci-failure', 'zenodo', 'automated']
            });