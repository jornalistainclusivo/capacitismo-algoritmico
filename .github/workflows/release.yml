name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON schemas
        run: python scripts/validate.py data/processed/
        env:
          PYTHONPATH: .

      - name: Validate raw data format
        run: python scripts/validate_raw.py

      - name: Check required fields
        run: python scripts/check_fields.py

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Run property-based tests
        run: pytest tests/ -v --tb=short

      - name: Generate validation report
        run: python scripts/generate_report.py > validation-report.md

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from conventional commits
          PREV_TAG=$(git tag --sort=-version:refname | head -n 2 | tail -n 1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD > CHANGELOG_RELEASE.md
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG_RELEASE.md
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG_RELEASE.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          files: |
            data/processed/incidents.parquet
            schemas/incident.json
            validation-report.md

      - name: Upload validation report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.md