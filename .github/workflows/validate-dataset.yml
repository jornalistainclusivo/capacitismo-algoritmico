name: Dataset Validation

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 2 * * *'  # Diário às 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    name: Validate Dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas pyarrow jsonschema pyyaml

      - name: Validate JSON schemas
        run: python scripts/validate.py data/processed/
        env:
          PYTHONPATH: .

      - name: Validate raw data format
        run: python scripts/validate_raw.py

      - name: Check required fields
        run: python scripts/check_fields.py

      - name: Validate schemas
        run: python scripts/validate_schemas.py

      - name: Generate validation report
        if: always()
        run: python scripts/generate_report.py > validation-report.md

      - name: Create validation summary
        if: always()
        run: |
          echo "validation_status=${{ job.status }}" >> $GITHUB_OUTPUT
          echo "report_path=validation-report.md" >> $GITHUB_OUTPUT

      - name: Post validation report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('validation-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            })

  check-links:
    name: Check External Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: '--verbose --max-concurrency 5'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notify on Failure
    if: failure()
    needs: [validate, check-links]
    runs-on: ubuntu-latest
    steps:
      - name: Notify via GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId
            });
            const body = `
            ❌ **Dataset Validation Failed**

            **Workflow:** ${context.workflow}
            **Run:** #${context.runId}
            **Branch:** ${context.ref}
            **Commit:** ${context.sha.substring(0,7)}

            [View Logs](${run.data.html_url})

            Please check the validation logs and fix any issues.
            `;
            await github.rest.issues.create({
              owner, repo,
              title: `[CI] Dataset Validation Failed - ${context.ref}`,
              body,
              labels: ['ci-failure', 'dataset', 'automated']
            });